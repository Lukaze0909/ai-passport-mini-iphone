# /etc/mosquitto/conf.d/passport.conf — example broker config.
# Local plain listener for the gateway and passportctl (same machine only).
listener 1883 127.0.0.1
# Public TLS listener for the device.
listener 8883
certfile /etc/letsencrypt/live/mqtt.example.com/fullchain.pem
keyfile  /etc/letsencrypt/live/mqtt.example.com/privkey.pem
allow_anonymous false
password_file /etc/mosquitto/passport.passwd
acl_file /etc/mosquitto/passport.acl
